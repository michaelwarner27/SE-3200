<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
    <script type="module" src="/static/stupid.js"></script>
    <!-- <script src="country.js" defer></script> -->
    <title>Document</title>
</head>
<body>
    <h1>Guess The Nation!</h1>

    <div id="authDiv">
    <p id="authMessage" role="alert"></p>

    <form id="loginForm">
        <h2>Log in</h2>
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required>
        <button type="submit">Log in</button>
    </form>

    <form id="registerForm">
        <h2>Register</h2>
        <label for="regFirst">First name</label>
        <input type="text" id="regFirst" required>
        <label for="regLast">Last name</label>
        <input type="text" id="regLast" required>
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" required>
        <label for="regPassword">Password (8-72 characters)</label>
        <input type="password" id="regPassword" required minlength="8" maxlength="72">
        <button type="submit">Register</button>
    </form>
    </div>

    <div id="userBar" hidden>
        <span id="welcome"></span>
        <button id="logoutButton">Log out</button>
    </div>


    <div id="guessDiv" hidden>
        <button id="start">Start!</button>
        <table>
            <tr>
                <th>Population</th>
                <th>Land Area</th>
                <th>Flag</th>
            </tr>
            <tr>
                <td id="Population">6032304</td>
                <td id="landAreaMiles">0</td>
                <td id="FlagHTML">&#127465;&#127472;</td>
                <!-- <td> <img id="FlagImage" src="https://flags.restcountries.com/v5/w640/dk.png"></td> -->
            </tr>
        </table>
        <form id="form">
            <label form="guess">What Nation is This?: </label><br>
            <input type="text" id="guess" name="guess"><br>
            <button type="submit"  id="GuessButton" > Guess</button>
        </form>
        <p id="cheat"></p>
        <button id="cheatButton">Cheat</button>
    </div>


    <div id ="correctDiv" hidden>
        <dl id="correctGuesses">

        </dl>
    </div>


    <div id="moreInfoDiv" hidden>
        <h2 id="infoCountryName">Name</h2> 
        <img id="Flag" src="https://flags.restcountries.com/v5/w640/dk.png">
        <p id="info">more info here!</p>
    </div>


</body>
</html>
