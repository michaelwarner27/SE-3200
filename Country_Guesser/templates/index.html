<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Color+Emoji&display=swap">
    <link rel="stylesheet" href="/static/style.css">
    <script type="module" src="/static/stupid.js"></script>
    <title>Guess The Nation!</title>
</head>
<body>
    <header id="topBar">
        <h1>🌍 Guess The Nation!</h1>
        <div id="userBar" hidden>
            <span id="scoreBadge" title="Countries you have guessed correctly"> <span id="score">0</span> guessed</span>
            <span id="welcome"></span>
            <button id="logoutButton" class="btn btn-ghost">Log out</button>
        </div>
    </header>

    <main>
        <section id="authDiv">
            <p id="authMessage" role="alert"></p>

            <div class="authCards">
                <form id="loginForm" class="card">
                    <h2>Log in</h2>
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" autocomplete="email" required>
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                    <button type="submit" class="btn btn-primary">Log in</button>
                </form>

                <form id="registerForm" class="card">
                    <h2>Register</h2>
                    <div class="nameRow">
                        <div>
                            <label for="regFirst">First name</label>
                            <input type="text" id="regFirst" autocomplete="given-name" required>
                        </div>
                        <div>
                            <label for="regLast">Last name</label>
                            <input type="text" id="regLast" autocomplete="family-name" required>
                        </div>
                    </div>
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" autocomplete="email" required>
                    <label for="regPassword">Password <small>(8-72 characters)</small></label>
                    <input type="password" id="regPassword" autocomplete="new-password" required minlength="8" maxlength="72">
                    <button type="submit" class="btn btn-secondary">Register</button>
                </form>
            </div>
        </section>

        <div id="gameLayout">
            <div id="leftColumn">
                <section id="guessDiv" class="card" hidden>
                    <div class="listPicker">
                        <label for="listSelect">Country pool</label>
                        <select id="listSelect"><option>Loading…</option></select>
                    </div>
                    <button id="start" class="btn btn-primary">Start!</button>

                    <div class="hints">
                        <div class="hint">
                            <span class="hintLabel">Population</span>
                            <span class="hintValue" id="Population">?</span>
                        </div>
                        <div class="hint">
                            <span class="hintLabel">Land Area</span>
                            <span class="hintValue" id="landAreaMiles">?</span>
                        </div>
                        <div class="hint hintFlag">
                            <span class="hintLabel">Flag</span>
                            <span class="hintValue" id="FlagHTML">?</span>
                        </div>
                    </div>

                    <form id="form">
                        <label for="guess">What nation is this?</label>
                        <div class="guessRow">
                            <input type="text" id="guess" name="guess" placeholder="Type a country name…" autocomplete="off">
                            <button type="submit" id="GuessButton" class="btn btn-secondary">Guess</button>
                        </div>
                        <p id="guessMessage" role="alert"></p>
                    </form>

                    <div class="cheatRow">
                        <button id="cheatButton" class="btn btn-ghost">Cheat</button>
                        <p id="cheat"></p>
                    </div>
                </section>

                <section id="correctDiv" class="card" hidden>
                    <div class="cardHeader">
                        <h2>Correct guesses</h2>
                        <button id="restartButton" class="btn btn-ghost">Restart</button>
                    </div>
                    <ul id="correctGuesses"></ul>
                </section>
            </div>

            <aside id="moreInfoDiv" class="card" hidden>
                <h2>Latest correct guess</h2>
                <h3 id="infoCountryName"></h3>
                <img id="Flag" src="../static/images/world-map.gif" alt="Flag of the most recent correct guess">
                <p id="infoDescription"></p>
                <dl id="info">
                    <dt>Capital</dt><dd id="infoCapital"></dd>
                    <dt>Languages</dt><dd id="infoLanguages"></dd>
                    <dt>Currency</dt><dd id="infoCurrency"></dd>
                    <dt>Subregion</dt><dd id="infoSubregion"></dd>
                    <dt>Government</dt><dd id="infoGovernment"></dd>
                    <dt>Status</dt><dd id="infoStatus" class="badges"></dd>
                    <dt>Memberships</dt><dd id="infoMemberships" class="badges"></dd>
                </dl>
                <a id="infoWiki" class="btn btn-primary" target="_blank" rel="noopener noreferrer" hidden>📖 Read on Wikipedia</a>
            </aside>
        </div>
    </main>
</body>
</html>
